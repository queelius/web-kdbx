[package]
name = "web-kdbx"
description = "Browser-side KDBX UI: read entries, edit with localStorage working copy, export via download (anchor of the *-kdbx ecosystem)"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alexander Towell <lex@metafunctor.com>"]
license = "MIT"
repository = "https://github.com/queelius/web-kdbx"
documentation = "https://docs.rs/web-kdbx"
readme = "README.md"
keywords = ["keepass", "kdbx", "wasm", "webassembly", "viewer"]
categories = ["wasm", "cryptography"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "web-kdbx-bundle"
path = "src/bin/web-kdbx-bundle.rs"
required-features = ["bundle"]

[features]
bundle = ["dep:clap", "dep:base64", "dep:anyhow", "dep:sha2"]

[dependencies]
keepass = { version = "0.12", features = ["serialization", "save_kdbx4"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"
totp-lite = "2"
base32 = "0.5"
url = "2"
uuid = { version = "1", features = ["serde"] }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.2", features = ["js"] }
clap = { version = "4", features = ["derive"], optional = true }
base64 = { version = "0.22", optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
